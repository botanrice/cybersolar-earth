    <style>
      body {
        background: #000;
        padding: 24px 16px 64px;
        align-items: flex-start;
      }
      body::before {
        display: none;
      }

      h1 {
        font-family: 'windowsregular', "Courier New", Courier, monospace;
        font-size: 13px;
        font-weight: normal;
        letter-spacing: 0.08em;
        color: #3a3a3a;
        margin-bottom: 24px;
      }

      a.back-link {
        font-family: 'windowsregular', "Courier New", Courier, monospace;
        font-size: 11px;
        color: #444;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 28px;
      }
      a.back-link:hover {
        color: #aaa;
      }

      /* ── Gallery ────────────────────────────────────── */

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 3px;
        width: 100%;
      }

      .gallery a {
        display: block;
        overflow: hidden;
        aspect-ratio: 1;
      }

      .gallery a img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: brightness(0.85);
        transition: filter 0.2s;
      }

      .gallery a:hover img,
      .gallery a:focus img {
        filter: brightness(1.05);
      }

      /* ── Lightbox ───────────────────────────────────── */

      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000;
        align-items: center;
        justify-content: center;
      }

      .lightbox:target {
        display: flex;
      }

      .lb-img {
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
        display: block;
        user-select: none;
      }

      .lb-close {
        position: absolute;
        top: 14px;
        right: 18px;
        color: #555;
        font-size: 22px;
        font-family: 'windowsregular', "Courier New", Courier, monospace;
        text-decoration: none;
        line-height: 1;
        padding: 8px 10px;
        z-index: 10;
        transition: color 0.15s;
        -webkit-tap-highlight-color: transparent;
      }
      .lb-close:hover { color: #fff; }

      .lb-prev,
      .lb-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        color: #444;
        font-family: 'windowsregular', "Courier New", Courier, monospace;
        font-size: 18px;
        text-decoration: none;
        padding: 28px 20px;
        z-index: 10;
        transition: color 0.15s;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .lb-prev { left: 0; }
      .lb-next { right: 0; }
      .lb-prev:hover,
      .lb-next:hover { color: #fff; }

      .lb-count {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'windowsregular', "Courier New", Courier, monospace;
        font-size: 10px;
        color: #2e2e2e;
        letter-spacing: 0.12em;
        white-space: nowrap;
        user-select: none;
      }
    </style>
